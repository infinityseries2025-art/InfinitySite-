<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакты</title>
<link rel="icon" href="assets/images/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contacts">

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark" data-role="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 3h12v3.5c0 3.5-2.5 6-6 6s-6-2.5-6-6V3Z" stroke="white" stroke-width="1.6"/><path d="M9 15.5h6v3H9v-3Z" stroke="white" stroke-width="1.6"/></svg>
      </span>
      <span data-role="site-name">Infinity Series Tournaments</span>
    </a>
    <button class="nav-toggle" aria-label="Меню"><span></span><span></span><span></span></button>
    <nav class="nav-links">
      <a href="index.html" data-page="home">Главная</a>
      <a href="news.html" data-page="news">Новости</a>
      <a href="participants.html" data-page="participants">Участники</a>
      <a href="schedule.html" data-page="schedule">Расписание</a>
      <a href="register.html" data-page="register">Регистрация</a>
      <a href="team.html" data-page="team">Организация</a>
      <a href="contacts.html" data-page="contacts">Контакты</a>
    </nav>
  </div>
</header>

<main class="page-surface">
  <section class="section container reveal">
    <span class="eyebrow">Связь с нами</span>
    <h1>Контакты</h1>
    <p class="tagline">Вопросы по регистрации команд, партнёрствам и трансляциям.</p>

    <div class="contact-grid" style="margin-top:20px;">
      <div class="card contact-card" data-role="contacts-list"></div>

      <div class="card contact-card">
        <h3 style="margin-bottom:16px;">Написать нам</h3>
        <form id="contact-form">
          <div class="form-field">
            <label for="name">Имя</label>
            <input id="name" name="name" type="text" required>
          </div>
          <div class="form-field">
            <label for="message">Сообщение</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn" type="submit">Отправить</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <span>© 2026 <span data-role="site-name">Infinity Series Tournaments</span></span>
    <a data-role="footer-email" href="#"></a>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
