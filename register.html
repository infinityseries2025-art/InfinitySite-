<html lang="ru">
<head>

</head>
<body data-page="register">

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark" data-role="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 3h12v3.5c0 3.5-2.5 6-6 6s-6-2.5-6-6V3Z" stroke="white" stroke-width="1.6"/><path d="M9 15.5h6v3H9v-3Z" stroke="white" stroke-width="1.6"/></svg>
      </span>
      <span data-role="site-name">Infinity Series Tournaments</span>
    </a>
    <button class="nav-toggle" aria-label="Меню"><span></span><span></span><span></span></button>
    <nav class="nav-links">
      <a href="index.html" data-page="home">Главная</a>
      <a href="news.html" data-page="news">Новости</a>
      <a href="participants.html" data-page="participants">Участники</a>
      <a href="schedule.html" data-page="schedule">Расписание</a>
      <a href="tournaments.html" data-page="tournaments">Турниры</a>
      <a href="register.html" data-page="register">Регистрация</a>

      <a href="contacts.html" data-page="contacts">Контакты</a>
    </nav>
  </div>
</header>

<main class="page-surface">
  <section class="section container reveal">
    <span class="eyebrow">Участие в турнире</span>
    <h1>Регистрация команды</h1>
    <p class="tagline">Заполни форму — заявка попадёт на модерацию организатору и появится в разделе «Участники» после одобрения.</p>

    <div class="card contact-card" style="max-width:640px; margin-top:20px;">
      <form id="register-form">
        <div class="form-field">
          <label for="teamName">Название команды *</label>
          <input id="teamName" name="teamName" type="text" required maxlength="60">
        </div>
        <div class="form-field">
          <label for="game">Дисциплина *</label>
          <select id="game" name="game" required style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--color-primary-line); background:var(--color-surface-alt); color:var(--color-text); font-family:var(--font-body); font-size:14px;">
            <option value="CS2">CS2</option>
            <option value="Dota2">Dota 2</option>
            <option value="PUBG">PUBG</option>
          </select>
        </div>
        <div class="form-field">
          <label for="captainName">Имя капитана *</label>
          <input id="captainName" name="captainName" type="text" required maxlength="60">
        </div>
        <div class="form-field">
          <label for="contact">Контакт для связи (Telegram/почта/телефон) *</label>
          <input id="contact" name="contact" type="text" required maxlength="120">
        </div>
        <div class="form-field">
          <label for="roster">Состав команды * (по одному игроку на строке или через запятую)</label>
          <textarea id="roster" name="roster" required placeholder="Nickname1&#10;Nickname2&#10;Nickname3"></textarea>
        </div>
        <div class="form-field">
          <label for="note">Комментарий (необязательно)</label>
          <textarea id="note" name="note" placeholder="Опыт участия в турнирах, пожелания и т.д."></textarea>
        </div>

        <!-- Honeypot: невидимое человеку поле, боты часто заполняют
             любые поля формы автоматически — если оно заполнено,
             заявку тихо отклоняем как спам. -->
        <div class="form-field hp-field" aria-hidden="true">
          <label for="website">Оставьте это поле пустым</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="form-field">
          <label for="captchaAnswer" class="captcha-question" id="captcha-question">Проверка: сколько будет?</label>
          <div class="captcha-row">
            <input id="captchaAnswer" name="captchaAnswer" type="number" required>
          </div>
        </div>

        <div id="register-status" style="margin-bottom:14px; font-size:14px;"></div>
        <button class="btn" id="register-submit" type="submit">Отправить заявку</button>
      </form>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
